# Rename `app` before `fly launch --no-deploy` / `fly deploy`. See Deploy_Plan.md.
app = "office-reservation"
primary_region = "ord"

[build]

[env]
  DATABASE_URL = "file:/data/app.db"
  NODE_ENV = "production"

# SQLite lives here. One volume = one machine: never scale this app above 1 machine.
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/auth/signin"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
